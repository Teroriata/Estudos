<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masteries dos Campeões</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #e53935;
        }
        .loading {
            font-size: 18px;
            color: #333;
        }
        img.champion-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Masteries dos Campeões</h1>
    <p id="puuid" class="loading">Carregando PUUID...</p>

    <table id="masteryTable" style="display: none;">
        <thead>
            <tr>
                <th>Campeão</th>
                <th>Imagem</th>
                <th>Nível</th>
                <th>Pontos</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <button onclick="window.location.reload();">Fechar</button>

    <script>
        const RIOT_API_KEY = "RGAPI-8dd4472f-51ed-4500-a5fc-bbd713f4ef50";
        const GAME_NAME = "tero";
        const TAG_LINE = "inf";

        async function getPuuid(gameName, tagLine) {
            const url = `https://americas.api.riotgames.com/riot/account/v1/accounts/by-riot-id/${gameName}/${tagLine}`;
            const headers = { "X-Riot-Token": RIOT_API_KEY };
            const response = await fetch(url, { headers });
            if (response.ok) {
                const data = await response.json();
                return data.puuid;
            } else {
                throw new Error("Erro ao obter PUUID");
            }
        }

        async function getChampionMasteries(puuid) {
            const url = `https://br1.api.riotgames.com/lol/champion-mastery/v4/champion-masteries/by-puuid/${puuid}`;
            const headers = { "X-Riot-Token": RIOT_API_KEY };
            const response = await fetch(url, { headers });
            if (response.ok) {
                return await response.json();
            } else {
                throw new Error("Erro ao obter maestrias");
            }
        }

        async function getChampionNames() {
            const url = 'https://ddragon.leagueoflegends.com/cdn/13.16.1/data/pt_BR/champion.json';
            const response = await fetch(url);
            if (response.ok) {
                const data = await response.json();
                const champions = data.data;
                return Object.fromEntries(Object.entries(champions).map(([key, value]) => [value.key, value.name]));
            } else {
                throw new Error("Erro ao acessar os dados dos campeões");
            }
        }

        async function displayData() {
            try {
                const puuid = await getPuuid(GAME_NAME, TAG_LINE);
                document.getElementById('puuid').textContent = `PUUID: ${puuid}`;

                const masteries = await getChampionMasteries(puuid);
                const championNames = await getChampionNames();

                const tableBody = document.getElementById('masteryTable').getElementsByTagName('tbody')[0];

                // Exibindo as maestrias dos 5 primeiros campeões
                masteries.slice(0, 5).forEach(champ => {
                    const championId = champ.championId;
                    const championName = championNames[championId] || "Desconhecido";

                    // URL da imagem do campeão
                    const imageUrl = `https://ddragon.leagueoflegends.com/cdn/13.16.1/img/champion/${championName}.png`;

                    const row = tableBody.insertRow();
                    
                    // Adicionando a imagem do campeão
                    const imageCell = row.insertCell(0);
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = championName;
                    img.classList.add('champion-image');
                    imageCell.appendChild(img);

                    row.insertCell(1).textContent = championName;
                    row.insertCell(2).textContent = champ.championLevel;
                    row.insertCell(3).textContent = champ.championPoints;
                });

                document.getElementById('masteryTable').style.display = 'table';
            } catch (error) {
                document.getElementById('puuid').textContent = `Erro: ${error.message}`;
            }
        }

        // Chama a função para carregar os dados assim que a página for carregada
        window.onload = displayData;
    </script>
</body>
</html>
